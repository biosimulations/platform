apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: biosim-gke

images:
- name: ghcr.io/biosimulations/platform-api
  newTag: backend-0.10.0
- name: ghcr.io/biosimulations/platform-worker
  newTag: backend-0.10.0
- name: ghcr.io/biosimulations/platform-frontend
  newTag: frontend-0.2.1
- name: docker.io/library/mongo
  newTag: 8.0.4

replicas:
- count: 1
  name: api
- count: 1
  name: worker
- count: 0
  name: mongodb

resources:
- ingress.yaml
- secret-ghcr.yaml
- secret-shared.yaml
- api-pvc.yaml
- worker-pvc.yaml
- ../../config/biosim-gke
- ../../base
