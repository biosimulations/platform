apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: biosim-local

images:
- name: ghcr.io/biosimulations/platform-api
  newTag: arm64_0.4.0
- name: ghcr.io/biosimulations/platform-worker
  newTag: arm64_0.4.0
- name: docker.io/library/mongo
  newTag: 8.0.4

replicas:
- count: 1
  name: api
- count: 1
  name: worker
- count: 1
  name: mongodb

resources:
- ingress.yaml
- secret-ghcr.yaml
- secret-shared.yaml
- api-pvc.yaml
- worker-pvc.yaml
- mongodb-pvc.yaml
- ../../config/biosim-local
- ../../base
