name: backend-ci

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
        - name: checkout repo
          uses: actions/checkout@v4
        - name: Install uv
          uses: astral-sh/setup-uv@v5
          with:
            version: 0.9.18
            enable-cache: true
        - name: Install dependencies
          run: uv sync --frozen --all-groups
        - name: Run tests
          run: uv run python -m pytest
