openapi: 3.1.0
info:
  title: biosim-server
  version: 0.10.0
paths:
  /compatibility/check:
    post:
      tags:
      - Compatibility
      summary: Check OMEX archive compatibility with simulators
      description: Upload an OMEX archive or provide a URL to find compatible simulators
        based on model format and algorithm requirements.
      operationId: check-compatibility
      parameters:
      - name: archive_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to an OMEX/COMBINE archive (alternative to file upload)
          title: Archive Url
        description: URL to an OMEX/COMBINE archive (alternative to file upload)
      - name: verbose
        in: query
        required: false
        schema:
          type: boolean
          description: Include per-version algorithm and ontology details
          default: false
          title: Verbose
        description: Include per-version algorithm and ontology details
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_check-compatibility'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simulations/run:
    post:
      tags:
      - Simulations
      summary: Run simulations for an OMEX archive across selected simulators
      operationId: run-simulations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSimulationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConglomerateStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /simulations/runs:
    post:
      tags:
      - Simulations
      summary: List simulation runs (owner-scoped, paginated, sortable, filterable)
      operationId: list-simulation-runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSimulationRunsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSimulationRunsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /simulations/{processing_id}:
    get:
      tags:
      - Simulations
      summary: Get status of a simulation run
      operationId: get-simulation-status
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConglomerateStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Simulations
      summary: 'Delete a simulation run''s records (admin: any run; publisher: own
        runs only)'
      operationId: delete-simulation-run
      security:
      - HTTPBearer: []
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simulations/{processing_id}/status:
    get:
      tags:
      - Simulations
      summary: Get status of a simulation run (explicit sub-resource, same data as
        GET /{id})
      operationId: get-simulation-status-explicit
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConglomerateStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simulations/{processing_id}/results:
    get:
      tags:
      - Simulations
      summary: Get the result-dataset catalog for each job in a simulation run
      operationId: get-simulation-results
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRunResults'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simulations/{processing_id}/logs:
    get:
      tags:
      - Simulations
      summary: Get simulator logs for each job in a simulation run
      operationId: get-simulation-logs
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRunLogs'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /simulations/{processing_id}/cancel:
    post:
      tags:
      - Simulations
      summary: Cancel a simulation run (owner or admin)
      operationId: cancel-simulation-run
      security:
      - HTTPBearer: []
      parameters:
      - name: processing_id
        in: path
        required: true
        schema:
          type: string
          title: Processing Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConglomerateStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/summary:
    get:
      tags:
      - Runs
      summary: Platform-owned run summary
      description: Return a public typed summary; upstream drift is a sanitized gateway
        error.
      operationId: get-run-summary
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
        '502':
          description: The upstream service failed, was unreachable, or returned an
            invalid summary.
        '504':
          description: Timed out while contacting the upstream service.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/page:
    get:
      tags:
      - Runs
      summary: Platform-owned run page aggregation
      operationId: get-run-page
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsPagePayload'
        '502':
          description: The upstream service failed or returned an invalid page resource.
        '504':
          description: Timed out while contacting the upstream service.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects:
    get:
      tags:
      - Projects
      summary: Search published projects (paginated slim results)
      operationId: list-projects
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 1-indexed page number.
          default: 1
          title: Page
        description: 1-indexed page number.
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Results per page.
          default: 20
          title: Perpage
        description: Results per page.
      - name: filters
        in: query
        required: false
        schema:
          type: string
          description: JSON array of {target, allowable_values}.
          default: ''
          title: Filters
        description: JSON array of {target, allowable_values}.
      - name: searchTerm
        in: query
        required: false
        schema:
          type: string
          description: Free-text search across title/abstract/description.
          default: ''
          title: Searchterm
        description: Free-text search across title/abstract/description.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStubPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/reindex:
    post:
      tags:
      - Projects
      summary: Rebuild the platform project search index from source collections
      operationId: reindex-projects
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                title: Response Reindex-Projects
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/stats:
    get:
      tags:
      - Projects
      summary: Facet counts (tags & categories) for a project search
      operationId: list-project-stats
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: string
          description: JSON array of {target, allowable_values}.
          default: ''
          title: Filters
        description: JSON array of {target, allowable_values}.
      - name: searchTerm
        in: query
        required: false
        schema:
          type: string
          description: Free-text search across title/abstract/description.
          default: ''
          title: Searchterm
        description: Free-text search across title/abstract/description.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectQueryStat'
                title: Response List-Project-Stats
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/summary:
    get:
      tags:
      - Projects
      summary: Platform-owned project summary
      description: Return a public typed summary; upstream drift is a sanitized gateway
        error.
      operationId: get-project-summary
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '502':
          description: The upstream service failed, was unreachable, or returned an
            invalid summary.
        '504':
          description: Timed out while contacting the upstream service.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/page:
    get:
      tags:
      - Projects
      summary: Platform-owned project page aggregation
      operationId: get-project-page
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectsPagePayload'
        '502':
          description: The upstream service failed or returned an invalid page resource.
        '504':
          description: Timed out while contacting the upstream service.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      tags:
      - Users
      summary: Get the authenticated user's profile
      operationId: get-current-user
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Users
      summary: Delete the authenticated user's account
      operationId: delete-current-user
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
    patch:
      tags:
      - Users
      summary: Update the authenticated user's profile
      operationId: update-current-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/demo/public:
    get:
      tags:
      - RBAC Demo
      summary: Public endpoint -- accessible to everyone, no bearer token required
      operationId: demo-public
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMessage'
  /api/v1/demo/private/me:
    get:
      tags:
      - RBAC Demo
      summary: Private endpoint -- any authenticated user, returns who the bearer
        token identifies
      operationId: demo-private-whoami
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
      security:
      - HTTPBearer: []
  /api/v1/demo/private/animal:
    get:
      tags:
      - RBAC Demo
      summary: Private endpoint -- requires admin, publisher, or user role; response
        varies by role
      operationId: demo-private-animal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAnimalResponse'
      security:
      - HTTPBearer: []
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
  /version:
    get:
      summary: Get Version
      operationId: get_version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Get Version Version Get
  /verify/omex:
    post:
      tags:
      - Verification
      summary: Request verification report for OMEX/COMBINE archive across simulators
      operationId: verify-omex
      parameters:
      - name: workflow_id_prefix
        in: query
        required: false
        schema:
          type: string
          description: Prefix for the workflow id.
          default: omex-verification-
          title: Workflow Id Prefix
        description: Prefix for the workflow id.
      - name: simulators
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: List of simulators 'name' or 'name:version' to compare.
          default:
          - amici
          - copasi
          - pysces
          - tellurium
          - vcell
          title: Simulators
        description: List of simulators 'name' or 'name:version' to compare.
      - name: include_outputs
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include the output data on which the comparison
            is based.
          default: false
          title: Include Outputs
        description: Whether to include the output data on which the comparison is
          based.
      - name: user_description
        in: query
        required: false
        schema:
          type: string
          description: User description of the verification run.
          default: my-omex-compare
          title: User Description
        description: User description of the verification run.
      - name: rel_tol
        in: query
        required: false
        schema:
          type: number
          description: Relative tolerance for proximity comparison.
          default: 0.0001
          title: Rel Tol
        description: Relative tolerance for proximity comparison.
      - name: abs_tol_min
        in: query
        required: false
        schema:
          type: number
          description: Min absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
          default: 0.001
          title: Abs Tol Min
        description: Min absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
      - name: abs_tol_scale
        in: query
        required: false
        schema:
          type: number
          description: Scale for absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
          default: 1.0e-05
          title: Abs Tol Scale
        description: Scale for absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
      - name: cache_buster
        in: query
        required: false
        schema:
          type: string
          description: Optional unique id for cache busting (unique string to force
            new simulation runs).
          default: '0'
          title: Cache Buster
        description: Optional unique id for cache busting (unique string to force
          new simulation runs).
      - name: observables
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of observables to include in the return data.
          title: Observables
        description: List of observables to include in the return data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_verify-omex'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyWorkflowOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /verify/{workflow_id}:
    get:
      tags:
      - Verification
      summary: Retrieve verification report for OMEX/COMBINE archive
      operationId: get-verify-output
      parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyWorkflowOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /verify/runs:
    post:
      tags:
      - Verification
      summary: Request verification report for biosimulation runs by run IDs
      operationId: verify-runs
      parameters:
      - name: workflow_id_prefix
        in: query
        required: false
        schema:
          type: string
          description: Prefix for the workflow id.
          default: runs-verification-
          title: Workflow Id Prefix
        description: Prefix for the workflow id.
      - name: biosimulations_run_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: List of biosimulations run IDs to compare.
          default:
          - 67817a2e1f52f47f628af971
          - 67817a2eba5a3f02b9f2938d
          title: Biosimulations Run Ids
        description: List of biosimulations run IDs to compare.
      - name: include_outputs
        in: query
        required: false
        schema:
          type: boolean
          description: Whether to include the output data on which the comparison
            is based.
          default: false
          title: Include Outputs
        description: Whether to include the output data on which the comparison is
          based.
      - name: user_description
        in: query
        required: false
        schema:
          type: string
          description: User description of the verification run.
          default: my-verify-job
          title: User Description
        description: User description of the verification run.
      - name: rel_tol
        in: query
        required: false
        schema:
          type: number
          description: Relative tolerance for proximity comparison.
          default: 0.0001
          title: Rel Tol
        description: Relative tolerance for proximity comparison.
      - name: abs_tol_min
        in: query
        required: false
        schema:
          type: number
          description: Min absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
          default: 0.001
          title: Abs Tol Min
        description: Min absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
      - name: abs_tol_scale
        in: query
        required: false
        schema:
          type: number
          description: Scale for absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
          default: 1.0e-05
          title: Abs Tol Scale
        description: Scale for absolute tolerance, where atol = max(atol_min, max(arr1,arr2)*atol_scale.
      - name: observables
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of observables to include in the return data.
          title: Observables
        description: List of observables to include in the return data.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyWorkflowOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BiosimSimulationRun:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        simulator_version:
          $ref: '#/components/schemas/BiosimulatorVersion'
        status:
          $ref: '#/components/schemas/BiosimSimulationRunStatus'
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        cpus:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cpus
        memory:
          anyOf:
          - type: integer
          - type: 'null'
          title: Memory
        max_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Time
        env_vars:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Env Vars
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        submitted:
          anyOf:
          - type: string
          - type: 'null'
          title: Submitted
        updated:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated
        project_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Size
        results_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Results Size
        runtime:
          anyOf:
          - type: integer
          - type: 'null'
          title: Runtime
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
      type: object
      required:
      - id
      - name
      - simulator_version
      - status
      title: BiosimSimulationRun
      description: 'data returned by api.biosimulations.org/runs/{run_id} '
    BiosimSimulationRunStatus:
      type: string
      enum:
      - CREATED
      - QUEUED
      - RUNNING
      - SKIPPED
      - PROCESSING
      - SUCCEEDED
      - FAILED
      - RUN_ID_NOT_FOUND
      - UNKNOWN
      title: BiosimSimulationRunStatus
    BiosimulatorVersion:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        image_url:
          type: string
          title: Image Url
        image_digest:
          type: string
          title: Image Digest
        created:
          type: string
          title: Created
        updated:
          type: string
          title: Updated
      type: object
      required:
      - id
      - name
      - version
      - image_url
      - image_digest
      - created
      - updated
      title: BiosimulatorVersion
    Body_check-compatibility:
      properties:
        uploaded_file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Uploaded File
